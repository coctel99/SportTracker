{% extends 'base.html' %}
{% block title %}Register – Sport Tracker{% endblock %}
{% block content %}

<div class="flex min-h-[70vh] items-center justify-center">
  <div class="w-full max-w-sm">

    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-gray-900">Create your account</h1>
      <p class="mt-1 text-sm text-gray-500">Start tracking your workouts today</p>
    </div>

    <div class="rounded-2xl bg-white shadow-sm border border-gray-200 p-8">
      <form method="post" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email"
                 placeholder="you@example.com"
                 class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm
                        text-gray-900 placeholder:text-gray-400 shadow-sm
                        focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 transition">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="password" name="password" type="password" required autocomplete="new-password"
                 minlength="8" placeholder="At least 8 characters"
                 class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm
                        text-gray-900 placeholder:text-gray-400 shadow-sm
                        focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 transition">
          <p class="mt-1 text-xs text-gray-400">Minimum 8 characters</p>
        </div>

        <button type="submit"
                class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm
                       hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition active:scale-95">
          Create account
        </button>
      </form>
    </div>

    <p class="mt-5 text-center text-sm text-gray-500">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="font-semibold text-indigo-600 hover:text-indigo-500">Sign in</a>
    </p>

  </div>
</div>

{% endblock %}
