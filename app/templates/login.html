{% extends 'base.html' %}
{% block title %}Login – Sport Tracker{% endblock %}
{% block content %}

<div class="flex min-h-[70vh] items-center justify-center">
  <div class="w-full max-w-sm">

    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-gray-900">Welcome back</h1>
      <p class="mt-1 text-sm text-gray-500">Sign in to your Sport Tracker account</p>
    </div>

    <div class="rounded-2xl bg-white shadow-sm border border-gray-200 p-8">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="space-y-5">

        <div>
          <label for="login" class="block text-sm font-medium text-gray-700 mb-1">Email or Username</label>
          <input id="login" name="login" type="text" required autocomplete="username"
                 placeholder="you@example.com or username"
                 class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm
                        text-gray-900 placeholder:text-gray-400 shadow-sm
                        focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 transition">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password"
                 placeholder="••••••••"
                 class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm
                        text-gray-900 placeholder:text-gray-400 shadow-sm
                        focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 transition">
        </div>

        <button type="submit"
                class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm
                       hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition active:scale-95">
          Sign in
        </button>
        </div>
      </form>
    </div>

    <p class="mt-5 text-center text-sm text-gray-500">
      No account?
      <a href="{{ url_for('auth.register') }}" class="font-semibold text-indigo-600 hover:text-indigo-500">Create one</a>
    </p>

  </div>
</div>

{% endblock %}
