name: Terraform

on:
  push:
    branches: ["main"]
    paths: ["terraform/**"]
  pull_request:
    branches: ["main"]
    paths: ["terraform/**"]
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  terraform:
    name: Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Write terraform.tfvars from GitHub secrets so no secrets are in the repo
      - name: Write terraform.tfvars
        run: |
          cat > terraform.tfvars <<TFVARS
          project_id        = "${{ vars.TF_VAR_PROJECT_ID }}"
          github_repo       = "${{ vars.TF_VAR_GITHUB_REPO }}"
          ssh_public_key    = "${{ vars.TF_VAR_SSH_PUBLIC_KEY }}"
          deploy_public_key = "${{ vars.TF_VAR_DEPLOY_PUBLIC_KEY }}"
          app_secret_key    = "${{ secrets.TF_VAR_APP_SECRET_KEY }}"
          TFVARS

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -out=tfplan

      # Only apply on push to main (not on PRs — PRs only plan)
      - name: terraform apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan

